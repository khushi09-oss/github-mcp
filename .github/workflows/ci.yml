name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      GITHUB_TOKEN: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.1"
          python-version: "3.12.13"
          enable-cache: false
      - name: Install locked environment
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Format
        run: uv run --locked ruff format --check .
      - name: Types
        run: uv run --locked mypy
      - name: Build
        run: uv build
      - name: Tests and archive boundaries
        run: uv run --locked pytest
      - name: Export locked audit inputs
        run: uv export --locked --no-emit-project --output-file dist/audit-requirements.txt --quiet
      - name: Dependency audit
        run: uv run --locked pip-audit --disable-pip --require-hashes --strict -r dist/audit-requirements.txt
      - name: Install built wheel
        run: uv pip install --python .venv --no-deps --reinstall dist/*.whl
      - name: Installed wheel startup
        run: uv run --locked --no-sync pytest tests/integration/test_stdio.py
