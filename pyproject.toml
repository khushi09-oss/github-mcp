[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "github-mcp"
version = "0.1.0"
description = "A local, read-only MCP server for exploring GitHub repositories"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp==1.30.0",
    "requests==2.33.0",
]

[project.optional-dependencies]
analysis = ["graphifyy==0.9.100"]
svg = ["graphifyy==0.9.100", "mmdr==0.4.0", "novasvg==0.11.4", "defusedxml==0.7.1"]

[project.scripts]
github-mcp = "github_mcp.__main__:main"

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "ruff==0.15.20",
    "types-requests==2.33.0.20261030",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["src/github_mcp"]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true

[tool.hatch.build.targets.wheel]
packages = ["src/github_mcp"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/github_mcp", "tests", "pyproject.toml", "uv.lock",
    "README.md", "CONTRIBUTING.md", ".gitignore",
    "LICENSE", "benchmarks/evaluate.py", "benchmarks/README.md",
    "benchmarks/fixtures/small.json", "docs/RELEASE.md",
]
